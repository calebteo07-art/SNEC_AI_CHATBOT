name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# A newer push to the same ref cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest, Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Pinned to the production runtime so the test signal matches prod.
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        env:
          ENVIRONMENT: test
          MOCK_MODE: "true"
        run: python -m pytest -q

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Logic harnesses (type-stripped unit tests)
        # Every pure-logic harness in frontend/tests, discovered rather than hand-listed.
        # The explicit list this replaces had drifted to 16 of 29 — thirteen harnesses
        # that existed, passed, and gated nothing. Browser harnesses exclude themselves
        # by their playwright import and run further down. See tests/_run_logic.mjs.
        run: npm run test:logic
      - name: Production build
        run: npm run build

      - name: Install Chromium for the browser harnesses
        run: npx playwright install --with-deps chromium

      - name: Visual assert harnesses (every browser harness, discovered)
        # The only gate that drives the real built app in a browser. Hand-run only until CI
        # picked them up, so they rotted unnoticed for weeks: a pinned rail silently covered
        # the flashcards exit, and asserts stayed pinned to changed copy and to routes that
        # had been deleted. Nothing else catches that class of regression.
        # `all` now DISCOVERS the harnesses rather than naming them — it had drifted to 6 of
        # 20, and eleven of the fourteen it skipped were passing the whole time. See
        # gated_harnesses() in the script and tests/test_browser_harness_registration.py.
        # SKIP_BUILD=1 reuses the build above; the script serves the standalone bundle,
        # warms the dynamic routes, then asserts.
        working-directory: ${{ github.workspace }}
        run: SKIP_BUILD=1 bash scripts/start-harness.sh all


  audit:
    name: Supply-chain audit
    runs-on: ubuntu-latest
    # Advisory, not a hard gate — Dependabot opens the remediation PRs. Surfaces
    # new CVEs without blocking unrelated work on unfixable transitives.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt || true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: npm audit (production deps)
        working-directory: frontend
        run: npm audit --omit=dev || true
