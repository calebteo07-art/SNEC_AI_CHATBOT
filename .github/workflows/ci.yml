name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# A newer push to the same ref cancels the in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest, Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Pinned to the production runtime so the test signal matches prod.
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        env:
          ENVIRONMENT: test
          MOCK_MODE: "true"
        run: python -m pytest -q

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Logic harnesses (type-stripped unit tests)
        # Pure-logic unit harnesses over greeting + leaderboard math + the first-login
        # order; no server/browser. The onboarding/tour pair pins the order a new student
        # meets the gates in — without them here, a reorder regresses silently (neither
        # suite was reachable from CI or scripts/start-harness.sh before).
        run: |
          node --experimental-strip-types tests/greeting_assert.mjs
          node --experimental-strip-types tests/tutor_greeting_assert.mjs
          node --experimental-strip-types tests/leaderboard_logic.mjs
          node --experimental-strip-types tests/onboarding_order_test.mjs
          node --experimental-strip-types tests/tour_engine_test.mjs
      - name: Production build
        run: npm run build

  audit:
    name: Supply-chain audit
    runs-on: ubuntu-latest
    # Advisory, not a hard gate — Dependabot opens the remediation PRs. Surfaces
    # new CVEs without blocking unrelated work on unfixable transitives.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt || true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: npm audit (production deps)
        working-directory: frontend
        run: npm audit --omit=dev || true
