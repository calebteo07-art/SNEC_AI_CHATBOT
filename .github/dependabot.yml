version: 2
updates:
  # Python runtime dependencies
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Advisory-driven bumps get their own PR, never bundled with feature
      # updates. The npm side proved why: the Next.js middleware-bypass fix
      # reached us only as one line of a 14-package version-update group PR,
      # which then sat unmerged for two months (2026-06-14 -> 2026-08-25)
      # because nobody wanted to review 14 unrelated bumps at once.
      # NOTE: this group is inert unless "Dependabot security updates" is
      # enabled in repo Settings -> Advanced Security. Config alone does not
      # turn advisory-driven PRs on.
      python-security:
        applies-to: security-updates
        patterns: ["*"]
      # One PR for patch/minor bumps keeps the noise down; majors come solo.
      python-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]

  # Frontend dependencies
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # See python-security above — same rationale, same enablement caveat.
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
      npm-minor-patch:
        applies-to: version-updates
        update-types: [minor, patch]
    ignore:
      # @types/node tracks the RUNTIME, not npm latest. CI and the Docker image
      # run Node 24, so types from the Node 26 line describe APIs we do not
      # ship. Revisit together with the Node major, not before.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is the native (Go) compiler rewrite, not a routine bump --
      # it failed this repo's typecheck job on 2026-07-10. It needs its own
      # migration spike; a weekly PR just re-litigates that. Revisit when the
      # spike is scheduled.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # TEMPORARY, and the only entry here meant to be removed soon. playwright
      # is pinned to an EXACT 1.60.0 in frontend/package.json and that pin is
      # load-bearing: 1.62.1 moves the test browser from Chrome 148 to 151,
      # which breaks three forfeit scenarios in station_forfeit_assert and
      # flashcards_forfeit_assert, all on the pagehide -> sendBeacon path.
      # Proved NOT to be the Next bump -- with next pinned unchanged at 16.2.1
      # and only playwright moved, the same three fail. Without this ignore the
      # weekly group PR re-proposes 1.62.1 (it already did, as #23) and merging
      # it silently re-breaks a Lumens-charging invariant. Lift this and the
      # exact pin together, once the Chrome 151 beacon question is settled.
      - dependency-name: "playwright"

  # GitHub Actions themselves
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
