<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
    <defs>
        <!-- Soft background chromatic blooms mimicking iridescent ink in paper -->
        <radialGradient id="gradYellow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#FFCF03" stop-opacity="0.35"/>
            <stop offset="60%" stop-color="#FF9238" stop-opacity="0.12"/>
            <stop offset="100%" stop-color="#FF5A59" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="gradCyan" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#00BDD2" stop-opacity="0.3"/>
            <stop offset="50%" stop-color="#3C90FF" stop-opacity="0.1"/>
            <stop offset="100%" stop-color="#AD72FF" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="gradPink" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#F96BD6" stop-opacity="0.25"/>
            <stop offset="70%" stop-color="#AD72FF" stop-opacity="0.08"/>
            <stop offset="100%" stop-color="#1F1F1F" stop-opacity="0"/>
        </radialGradient>

        <!-- Ink bleed filter simulating liquid spreading on paper fibres -->
        <filter id="inkBleed" x="-20%" y="-20%" width="140%" height="140%">
            <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" result="noise" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="5" xChannelSelector="R" yChannelSelector="G" result="displaced" />
            <feGaussianBlur in="displaced" stdDeviation="1.2" result="blurred" />
            <feMerge>
                <feMergeNode in="blurred" />
                <feMergeNode in="SourceGraphic" opacity="0.7" />
            </feMerge>
        </filter>

        <!-- Pure soft glow for the light spectrum atmosphere -->
        <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="25" />
        </filter>
    </defs>

    <!-- ================= BACKGROUND BLOOMS ================= -->
    <g filter="url(#softGlow)">
        <circle cx="380" cy="280" r="220" fill="url(#gradYellow)" />
        <circle cx="425" cy="315" r="240" fill="url(#gradCyan)" />
        <circle cx="390" cy="330" r="180" fill="url(#gradPink)" />
    </g>

    <!-- ================= TECHNICAL GRAPH LAYER ================= -->
    <!-- Fine grid and coordinates in low opacity ink -->
    <g stroke="#1F1F1F" stroke-width="0.5" opacity="0.08">
        <!-- Horizontal & Vertical Base Lines -->
        <line x1="80" y1="300" x2="720" y2="300" />
        <line x1="400" y1="60" x2="400" y2="540" />
        
        <!-- Diagonal Guides -->
        <line x1="180" y1="80" x2="620" y2="520" stroke-dasharray="2 8" />
        <line x1="180" y1="520" x2="620" y2="80" stroke-dasharray="2 8" />
        
        <!-- Concentric Grid Circles -->
        <circle cx="400" cy="300" r="160" fill="none" />
        <circle cx="400" cy="300" r="220" fill="none" />
        <circle cx="400" cy="300" r="280" fill="none" />
    </g>

    <!-- Fine tick marks around the outer perimeter -->
    <g stroke="#1F1F1F" stroke-width="0.8" opacity="0.15">
        <path d="M 120,300 L 130,300 M 670,300 L 680,300 M 400,80 L 400,90 M 400,510 L 400,520" />
        <circle cx="400" cy="300" r="270" fill="none" stroke-dasharray="1 11.97" />
    </g>

    <!-- Corner Framing Crop Marks -->
    <g stroke="#1F1F1F" stroke-width="1" opacity="0.12">
        <path d="M 50,50 L 80,50 M 50,50 L 50,80" />
        <path d="M 750,50 L 720,50 M 750,50 L 750,80" />
        <path d="M 50,550 L 80,550 M 50,550 L 50,520" />
        <path d="M 750,550 L 720,550 M 750,550 L 750,520" />
    </g>


    <!-- ================= RETICLE ELEMENTS & CONCENTRIC ARCS ================= -->
    
    <!-- Outer Spectral Ring with asymmetric dash patterns -->
    <circle cx="400" cy="300" r="250" fill="none" stroke="#AD72FF" stroke-width="1.5" stroke-dasharray="180 40 10 40 40 40" opacity="0.25" />
    <circle cx="400" cy="300" r="246" fill="none" stroke="#00BDD2" stroke-width="0.8" stroke-dasharray="5 150 40 40" opacity="0.3" />

    <!-- Sharp colored measuring arcs -->
    <g fill="none" stroke-linecap="round">
        <!-- Inner Ring Arcs -->
        <path d="M 280,300 A 120,120 0 0,1 400,180" stroke="#FF5A59" stroke-width="2" opacity="0.35" />
        <path d="M 400,180 A 120,120 0 0,1 520,300" stroke="#60D673" stroke-width="2" opacity="0.35" />
        <path d="M 520,300 A 120,120 0 0,1 400,420" stroke="#4FA0FF" stroke-width="2" opacity="0.35" />
        <path d="M 400,420 A 120,120 0 0,1 280,300" stroke="#FFCF03" stroke-width="2" opacity="0.35" />

        <!-- Bleeding Overlay Arcs (mimicking the ink bloom) -->
        <path d="M 295,205 A 135,135 0 0,1 505,205" stroke="#F96BD6" stroke-width="3" opacity="0.2" filter="url(#inkBleed)" />
        <path d="M 505,395 A 135,135 0 0,1 295,395" stroke="#00BDD2" stroke-width="3" opacity="0.2" filter="url(#inkBleed)" />
        
        <!-- Medium Radial Ticks -->
        <circle cx="400" cy="300" r="175" stroke="#4FA0FF" stroke-width="1.2" stroke-dasharray="2 30" opacity="0.25" />
        <circle cx="400" cy="300" r="180" stroke="#88DE42" stroke-width="1" stroke-dasharray="1 10" opacity="0.25" />
    </g>

    <!-- Subtly Bleeding Primary Crosshair Arcs -->
    <g fill="none" stroke-width="2.5" stroke-linecap="round" filter="url(#inkBleed)">
        <!-- Top-Left Segment -->
        <path d="M 330,300 A 70,70 0 0,1 400,230" stroke="#FF5A59" opacity="0.4" />
        <!-- Top-Right Segment -->
        <path d="M 400,230 A 70,70 0 0,1 470,300" stroke="#00BDD2" opacity="0.4" />
        <!-- Bottom-Right Segment -->
        <path d="M 470,300 A 70,70 0 0,1 400,370" stroke="#FFCF03" opacity="0.4" />
        <!-- Bottom-Left Segment -->
        <path d="M 400,370 A 70,70 0 0,1 330,300" stroke="#60D673" opacity="0.4" />
    </g>


    <!-- ================= THE CALM PUPIL & INNER FOCUS ================= -->
    <!-- Central diagnostic circle layers -->
    <circle cx="400" cy="300" r="55" fill="none" stroke="#1F1F1F" stroke-width="0.8" opacity="0.12" />
    <circle cx="400" cy="300" r="42" fill="none" stroke="#3C90FF" stroke-width="1" stroke-dasharray="3 6" opacity="0.35" />
    <circle cx="400" cy="300" r="30" fill="none" stroke="#FF9238" stroke-width="1.2" opacity="0.25" />
    <circle cx="400" cy="300" r="18" fill="none" stroke="#88DE42" stroke-width="1" stroke-dasharray="1 4" opacity="0.4" />

    <!-- Calm Pupil Dot (Layered for depth and low-opacity compliance) -->
    <circle cx="400" cy="300" r="6" fill="#1F1F1F" opacity="0.45" />
    <circle cx="400" cy="300" r="3.5" fill="#1F1F1F" opacity="0.35" />
    <circle cx="400" cy="300" r="1.5" fill="#1F1F1F" opacity="0.5" />


    <!-- ================= SCHEMATIC ANCILLARY DATA ================= -->
    
    <!-- Micro Goniometer Ticks (Inner Rotation Ring) -->
    <g stroke="#00BDD2" stroke-width="1" opacity="0.35">
        <line x1="400" y1="216" x2="400" y2="221" />
        <line x1="400" y1="216" x2="400" y2="221" transform="rotate(30, 400, 300)" />
        <line x1="400" y1="216" x2="400" y2="221" transform="rotate(60, 400, 300)" />
        <line x1="400" y1="216" x2="400" y2="221" transform="rotate(90, 400, 300)" />
        <line x1="400" y1="216" x2="400" y2="221" transform="rotate(120, 400, 300)" />
        <line x1="400" y1="216" x2="400" y2="221" transform="rotate(150, 400, 300)" />
        <line x1="400" y1="216" x2="400" y2="221" transform="rotate(180, 400, 300)" />
        <line x1="400" y1="216" x2="400" y2="221" transform="rotate(210, 400, 300)" />
        <line x1="400" y1="216" x2="400" y2="221" transform="rotate(240, 400, 300)" />
        <line x1="400" y1="216" x2="400" y2="221" transform="rotate(270, 400, 300)" />
        <line x1="400" y1="216" x2="400" y2="221" transform="rotate(300, 400, 300)" />
        <line x1="400" y1="216" x2="400" y2="221" transform="rotate(330, 400, 300)" />
    </g>

    <g stroke="#3C90FF" stroke-width="0.8" opacity="0.25">
        <!-- Intercardinal fine offsets -->
        <line x1="400" y1="164" x2="400" y2="167" transform="rotate(15, 400, 300)" />
        <line x1="400" y1="164" x2="400" y2="167" transform="rotate(45, 400, 300)" />
        <line x1="400" y1="164" x2="400" y2="167" transform="rotate(75, 400, 300)" />
        <line x1="400" y1="164" x2="400" y2="167" transform="rotate(105, 400, 300)" />
        <line x1="400" y1="164" x2="400" y2="167" transform="rotate(135, 400, 300)" />
        <line x1="400" y1="164" x2="400" y2="167" transform="rotate(165, 400, 300)" />
        <line x1="400" y1="164" x2="400" y2="167" transform="rotate(195, 400, 300)" />
        <line x1="400" y1="164" x2="400" y2="167" transform="rotate(225, 400, 300)" />
        <line x1="400" y1="164" x2="400" y2="167" transform="rotate(255, 400, 300)" />
        <line x1="400" y1="164" x2="400" y2="167" transform="rotate(285, 400, 300)" />
        <line x1="400" y1="164" x2="400" y2="167" transform="rotate(315, 400, 300)" />
        <line x1="400" y1="164" x2="400" y2="167" transform="rotate(345, 400, 300)" />
    </g>

    <!-- Cardinal reticle pointers -->
    <polygon points="400,146 404,138 396,138" fill="#FF5A59" opacity="0.45" />
    <polygon points="400,454 404,462 396,462" fill="#FFCF03" opacity="0.45" />
    <polygon points="246,300 238,296 238,304" fill="#3C90FF" opacity="0.45" />
    <polygon points="554,300 562,296 562,304" fill="#00BDD2" opacity="0.45" />

    <!-- Diagnostic HUD sideboxes -->
    <!-- Left Box -->
    <g transform="translate(100, 100)" opacity="0.35">
        <rect x="0" y="0" width="100" height="35" rx="3" fill="none" stroke="#3C90FF" stroke-width="0.8" />
        <line x1="8" y1="12" x2="45" y2="12" stroke="#3C90FF" stroke-width="2" />
        <line x1="8" y1="22" x2="85" y2="22" stroke="#F96BD6" stroke-width="1" />
        <circle cx="90" cy="10" r="2" fill="#88DE42" />
    </g>

    <!-- Right Box -->
    <g transform="translate(600, 100)" opacity="0.35">
        <rect x="0" y="0" width="100" height="35" rx="3" fill="none" stroke="#00BDD2" stroke-width="0.8" />
        <line x1="8" y1="12" x2="65" y2="12" stroke="#00BDD2" stroke-width="1.5" />
        <line x1="8" y1="22" x2="45" y2="22" stroke="#FF9238" stroke-width="2" />
        <polygon points="88,20 94,20 91,15" fill="#FF5A59" />
    </g>

    <!-- Waveform diagnostics at base -->
    <g stroke-linecap="round" fill="none">
        <!-- Left Calm Sine Wave -->
        <path d="M 120,490 Q 140,475 160,490 T 200,490 T 240,490 T 280,490" stroke="#60D673" stroke-width="1.2" opacity="0.3" />
        <!-- Right Calm Sine Wave -->
        <path d="M 520,490 Q 540,505 560,490 T 600,490 T 640,490 T 680,490" stroke="#00BDD2" stroke-width="1.2" opacity="0.3" />
    </g>

    <!-- Fine Tech Callout Lines -->
    <g stroke="#1F1F1F" stroke-width="0.8" opacity="0.2">
        <line x1="310" y1="210" x2="230" y2="160" />
        <line x1="230" y1="160" x2="190" y2="160" />
        <circle cx="310" cy="210" r="1.5" fill="#1F1F1F" />
        <circle cx="190" cy="160" r="1.5" fill="#1F1F1F" />

        <line x1="490" y1="210" x2="570" y2="160" />
        <line x1="570" y1="160" x2="610" y2="160" />
        <circle cx="490" cy="210" r="1.5" fill="#1F1F1F" />
        <circle cx="610" cy="160" r="1.5" fill="#1F1F1F" />
    </g>
</svg>