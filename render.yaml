services:
  - type: web
    name: eyebot
    runtime: python
    region: singapore
    plan: free
    buildCommand: bash render-build.sh
    startCommand: bash scripts/start-prod.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: NODE_VERSION
        value: "24.13.0"
      - key: ENVIRONMENT
        value: production
      # After first deploy, set ALLOWED_ORIGINS to your Render URL, e.g.:
      # https://eyebot.onrender.com
      # Leave blank or set to * for initial deployment
      - key: ALLOWED_ORIGINS
        value: "*"
      # --- Secrets: add these in the Render dashboard, NOT here ---
      # GEMINI_API_KEY
      # GEMINI_MODEL
      # SUPABASE_URL
      # SUPABASE_SERVICE_ROLE_KEY
      # JWT_SECRET
      # JWT_EXPIRE_HOURS
      # GOOGLE_SPREADSHEET_ID
      # GOOGLE_FOLDER_CASES
      # GOOGLE_FOLDER_IMAGES
      # GOOGLE_FOLDER_AUDIT
      # SUPER_ADMIN_EMAIL
      # --- Email: Render BLOCKS outbound SMTP, so production must use an HTTPS
      #     provider. Set EMAIL_PROVIDER + EMAIL_FROM + the chosen provider key.
      # EMAIL_PROVIDER        # brevo | sendgrid | resend  (default smtp = local dev only)
      # EMAIL_FROM            # sender address, e.g. snec.tne.edu@gmail.com
      # BREVO_API_KEY         # if EMAIL_PROVIDER=brevo   (single-sender, 300/day free, no domain needed)
      # SENDGRID_API_KEY      # if EMAIL_PROVIDER=sendgrid (single-sender verification)
      # RESEND_API_KEY        # if EMAIL_PROVIDER=resend   (needs a verified domain)
      # SMTP_EMAIL            # local dev only (SMTP is blocked on Render)
      # SMTP_APP_PASSWORD     # local dev only

  - type: cron
    name: eyebot-keep-alive
    runtime: python
    region: singapore
    plan: free
    schedule: "*/10 * * * *"
    buildCommand: echo ""
    startCommand: python -c "import urllib.request; urllib.request.urlopen('https://snec-ai-chatbot.onrender.com/health')"
