services:
  - type: web
    name: eyebot
    # Built from the multi-stage Dockerfile (Next standalone + Python 3.12) to
    # MATCH the live service. A prior `runtime: python` here had drifted from
    # reality — the service builds the Dockerfile — and deleting the Dockerfile
    # took prod down (2026-06-26). The start command is the Dockerfile CMD
    # (`bash scripts/start-prod.sh`); the base images pin Python 3.12 + Node 24,
    # so no buildCommand/startCommand or PYTHON_VERSION/NODE_VERSION are needed.
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: singapore
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      # Explicit public origin REQUIRED in production — the boot guard
      # (tools/shared/config.py) refuses to start on "*" or empty. Update if the
      # service URL changes.
      - key: ALLOWED_ORIGINS
        value: "https://snec-ai-chatbot.onrender.com"
      # Stateless uvicorn workers. 2 needs ~1GB RAM — pair with the `standard`
      # plan (see note above) for real cohorts; the `free`/`starter` 512MB tier
      # should stay at 1.
      - key: WEB_CONCURRENCY
        value: "1"
      # --- Secrets: add these in the Render dashboard, NOT here ---
      # Full annotated inventory, including what breaks when each is wrong:
      # docs/OPERATIONS.md §2.
      # REDIS_URL              # rate-limit + cross-worker state; provision a
      #                          Render Key Value store. Falls back to in-memory
      #                          (per-worker) if unset — fine at WEB_CONCURRENCY=1.
      # GEMINI_API_KEY         # REQUIRED — boot is refused without it, so prod
      #                          can never silently serve MOCK_MODE to students.
      # GEMINI_API_KEY_2       # optional fallback keys; the client rotates to
      # GEMINI_API_KEY_3       # these when the primary key's quota is exhausted.
      # SUPABASE_URL           # REQUIRED
      # SUPABASE_SERVICE_ROLE_KEY  # REQUIRED (service role, never the anon key)
      # JWT_SECRET             # REQUIRED (>= 32 chars; changing it logs everyone out)
      # JWT_EXPIRE_HOURS
      # GOOGLE_SPREADSHEET_ID
      # SUPER_ADMIN_EMAIL      # point this at an INSTITUTIONAL address, not an
      #                          individual's — blank fails closed.
      # SENTRY_DSN             # error tracking; installed but DORMANT until set.
      # --- Email (Gmail API): Render BLOCKS outbound SMTP, and a gmail.com From
      #     address can't be domain-authenticated -> send through the Gmail API
      #     (HTTPS, Google DKIM-signs it). Mint the token with
      #     scripts/gmail_oauth_setup.py, then set all four:
      # EMAIL_FROM            # the authorized account, e.g. snec.tne.edu@gmail.com
      # GMAIL_CLIENT_ID       # Google Cloud OAuth client (Desktop app)
      # GMAIL_CLIENT_SECRET
      # GMAIL_REFRESH_TOKEN   # from scripts/gmail_oauth_setup.py

  - type: cron
    name: eyebot-keep-alive
    runtime: python
    region: singapore
    plan: free
    schedule: "*/10 * * * *"
    buildCommand: echo ""
    startCommand: python -c "import urllib.request; urllib.request.urlopen('https://snec-ai-chatbot.onrender.com/health', timeout=30)"
